name: Build beta installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple silicon
            runner: macos-15
          - label: macOS Intel
            runner: macos-15-intel
          - label: Windows x86-64
            runner: windows-2025
          - label: Linux x86-64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: nfit
          cache-environment: true
          init-shell: bash
      - name: Refresh nfit package metadata
        shell: bash -el {0}
        run: python -m pip install --no-deps --editable .
      - name: Build and smoke-test installer
        shell: bash -el {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/distribution/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: nfit-${{ runner.os }}-${{ runner.arch }}
          path: dist/installers/*
          if-no-files-found: error

  beta-release:
    name: Publish experimental beta release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v7
        with:
          path: dist/installers
          merge-multiple: true
      - id: version
        name: Read package version
        shell: bash
        run: |
          value="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Publish experimental beta release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" \
              --title "nfit $VERSION beta" \
              --notes "Experimental beta software developed by Paul M. Neves with assistance from AI coding tools. Validate scientific results independently."
            gh release upload "v$VERSION" dist/installers/* --clobber
          else
            gh release create "v$VERSION" dist/installers/* \
              --title "nfit $VERSION beta" \
              --notes "Experimental beta software developed by Paul M. Neves with assistance from AI coding tools. Validate scientific results independently."
          fi
