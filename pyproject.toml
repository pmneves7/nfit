[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metallix"
version = "0.0.1"
description = "Reduced magnetic-scattering analysis for nearly magnetic metals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "metallix contributors" }
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "matplotlib>=3.6",
  "h5py>=3.8",
  "pyside6>=6.6",
  "emcee>=3.1",
  "gemmi>=0.6",
]
keywords = [
  "inelastic neutron scattering",
  "magnetic susceptibility",
  "paramagnons",
  "condensed matter physics",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
metallix = "metallix.project_gui:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "numba>=0.58",
]
# Accelerated compute backends for large spin-fluctuation fits. Both are
# optional: metallix falls back to numpy when they are absent, and selects a
# backend by problem size (see metallix.set_rpa_backend).
accel = [
  "numba>=0.58",
]
# GPU backend. Install the CuPy wheel matching your CUDA toolkit, e.g.
# `pip install cupy-cuda12x`; the generic `cupy` sdist requires a local CUDA
# build. AMD ROCm builds of CuPy also work.
gpu = [
  "cupy>=12",
]
docs = [
  "sphinx>=7,<9",
  "myst-parser>=2,<5",
  "myst-nb>=1",
  "sphinx-copybutton>=0.5",
  "furo>=2024.1.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
